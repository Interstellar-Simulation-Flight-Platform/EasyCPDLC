name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EasyCPDLC.sln

      - name: Build
        run: dotnet build EasyCPDLC.sln -c Release --no-restore

      - name: Publish (single-file, framework-dependent)
        run: dotnet publish EasyCPDLC/EasyCPDLC.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyCPDLC-win-x64
          path: publish/
          if-no-files-found: error
