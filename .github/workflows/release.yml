name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0), must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=$($env:WORKFLOW_INPUT_TAG)" >> $env:GITHUB_OUTPUT
          } else {
            "value=$($env:GITHUB_REF_NAME)" >> $env:GITHUB_OUTPUT
          }
        env:
          WORKFLOW_INPUT_TAG: ${{ inputs.tag }}

      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Verify tag matches assembly version
        run: |
          $tag = "${{ steps.tag.outputs.value }}".TrimStart("v")
          $match = Select-String -Path "EasyCPDLC\Properties\AssemblyInfo.cs" -Pattern '^\[assembly:\s*AssemblyVersion\("([^"]+)"\)\]'
          if (-not $match) { Write-Error "AssemblyVersion not found in AssemblyInfo.cs" }
          $asm = $match.Matches[0].Groups[1].Value
          if ($asm -like '*`*') { Write-Error "AssemblyVersion '$asm' contains a wildcard. Use a fixed version like '0.2.0'." }
          if ($tag -ne $asm) {
            Write-Error "Tag version '$tag' does not match AssemblyVersion '$asm'. Bump AssemblyInfo.cs and re-tag."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EasyCPDLC.sln

      - name: Build
        run: dotnet build EasyCPDLC.sln -c Release --no-restore

      - name: Publish (single-file, framework-dependent)
        run: dotnet publish EasyCPDLC/EasyCPDLC.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o publish

      - name: Version the bundle
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          Compress-Archive -Path "publish\*" -DestinationPath "EasyCPDLC-$tag-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyCPDLC-${{ steps.tag.outputs.value }}-win-x64
          path: EasyCPDLC-*-win-x64.zip
          if-no-files-found: error

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: EasyCPDLC ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: EasyCPDLC-*-win-x64.zip
          fail_on_unmatched_files: true
